[env:cyd]
platform = espressif32@~6.10.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 4MB

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    -DUSER_SETUP_LOADED=1
    -include src/User_Setup.h
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSMOOTH_FONT=1
    -DSUPPORT_TRANSACTIONS=1
    -DCONFIG_MBEDTLS_CERTIFICATE_BUNDLE=1
    -DCONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=1

board_build.partitions = partitions/cyd_4mb.csv
board_build.embed_files = certs/x509_crt_bundle.bin

lib_deps =
    arkhipenko/TaskScheduler@^3.8.5
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.2.1
    ; SpotifyArduino is vendored under lib/SpotifyArduino/ so the
    ; buffer-overflow fix and the urlEncode() form encoding in
    ; refreshAccessToken(), plus the new setBearerToken() method,
    ; survive a `pio run -t clean`. See
    ; lib/SpotifyArduino/library.json for the patch notes. Remove
    ; this comment + the lib_extra_dirs line below to go back to
    ; the upstream git library.
    madhephaestus/ESP32Encoder@^0.11.0
    ricmoo/QRCode@^0.0.1

; Vendored libraries (SpotifyArduino patch — see lib/SpotifyArduino/)
lib_extra_dirs = lib
